# KAN-110 (review 10544): temporary, branch-only workflow, run 2. The UNCHANGED QB sandbox on a standard
# GitHub-hosted ubuntu-24.04 (x86_64) runner, with the owner/reviewer-approved offline build that omits ONLY
# the optional size report (build:stats, which fetches bundlephobia.com). No model calls, no secrets, no new
# egress, nothing installed on the runner, no retries, no larger runner. Never on main.
# Triggered only by a push of this file on the KAN-110 branch.
name: kan110-feasibility

on:
  push:
    branches: [kan110-public-task-import]
    paths: ['.github/workflows/kan110-feasibility.yml']

permissions:
  contents: read

concurrency:
  group: kan110-feasibility
  cancel-in-progress: false

jobs:
  feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LABEL: run2-approved-offline
      OUT: bench/public/feasibility/results/linux-x64/run2-approved-offline
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Identity
        run: |
          mkdir -p "$OUT"
          {
            echo "qb_commit=$(git rev-parse HEAD)"
            echo "main_784e721=$(git rev-parse 784e721)"
            echo "qb_sandbox_matches_main_784e721=$(git diff --quiet 784e721 HEAD -- lib sandbox agent verify context && echo yes || echo no)"
            echo "runner_image=${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "uname=$(uname -srm)"
            docker version --format 'docker_server={{.Server.Version}} server_arch={{.Server.Arch}}'
          } | tee "$OUT/identity.txt"

      - name: Freeze the environment before execution (base digest, QB images, Node/npm, install-script policy)
        run: |
          set -eu
          docker pull -q node:24-bookworm-slim
          node -e "(async()=>{await require('./lib/sandbox/agent').ensureAgentImage();await require('./lib/sandbox/egress').ensureProxyImage();await require('./lib/sandbox/workspace').ensureToolsImage();})()"
          AGENT=$(node -p "require('./lib/sandbox/agent').AGENT_IMAGE")
          node -e '
            const { execFileSync } = require("child_process"); const fs = require("fs");
            const d = (...a) => execFileSync("docker", a, { encoding: "utf8" }).trim();
            const agent = process.argv[1];
            const base = JSON.parse(d("image", "inspect", "node:24-bookworm-slim"))[0];
            const img = JSON.parse(d("image", "inspect", agent))[0];
            const bl = base.RootFS.Layers, al = img.RootFS.Layers;
            const builtOnBase = bl.every((l, i) => al[i] === l);
            const inImg = d("run", "--rm", "--network", "none", "--entrypoint", "sh", agent, "-c",
              "echo node=$(node -v); echo npm=$(npm -v); echo ignore_scripts=$(npm config get ignore-scripts); npm config ls -l 2>/dev/null | grep -iE \"script\" | sed \"s/^/npm_config: /\"");
            const env = { note: "NEW environment: the run-1 image was built on an ephemeral runner and not retained, so it cannot be reused; this run freezes its own identity before executing.",
              base_image: { ref: "node:24-bookworm-slim", repo_digests: base.RepoDigests, id: base.Id, layers: bl.length },
              agent_image: { ref: agent, id: img.Id, architecture: img.Architecture, layers: al.length, built_on_recorded_base_layers: builtOnBase },
              in_image: inImg.split("\n") };
            fs.writeFileSync(process.env.OUT + "/environment.json", JSON.stringify(env, null, 2) + "\n");
            console.log(JSON.stringify(env, null, 2));
            if (!builtOnBase) { console.error("::error::QB agent image is not built on the recorded base digest"); process.exit(1); }' "$AGENT"

      - name: Preflight (stop if not native x86_64 or resources are insufficient)
        run: |
          set -eu
          [ "$(uname -m)" = "x86_64" ] || { echo "::error::not x86_64"; exit 1; }
          [ "$(docker info --format '{{.Architecture}}')" = "x86_64" ] || { echo "::error::docker is not x86_64"; exit 1; }
          free -b | tee "$OUT/free.txt"; df -B1 / | tee "$OUT/df.txt"
          [ "$(df -B1 --output=avail / | tail -1)" -ge $((10*1024*1024*1024)) ] || { echo "::error::less than 10 GiB free disk"; exit 1; }
          node bench/public/feasibility/immutable-feasibility.cjs --preflight --label="$LABEL" > "$OUT/preflight.stdout" 2>&1 || { tail -40 "$OUT/preflight.stdout"; exit 1; }
          node -e '
            const p = require("./" + process.env.OUT + "/preflight.json");
            console.log(JSON.stringify({ host: p.host, docker: p.docker, admission: p.admission, images: p.images }, null, 1));
            if (!p.admission || p.admission.ok !== true) { console.error("::error::QB admission refused"); process.exit(1); }
            if (!p.qb_sandbox_matches_main_784e721) { console.error("::error::sandbox code differs from main 784e721"); process.exit(1); }'

      - name: Run (install -> approved offline build -> pinned Jest list -> pinned Jest run; stop each task at first failure)
        run: node bench/public/feasibility/immutable-feasibility.cjs --label="$LABEL" --build=approved-offline 2006 2005 2>&1 | tee "$OUT/run.log"

      - name: Results table
        if: always()
        run: |
          node -e '
            const fs = require("fs"); const o = process.env.OUT; const rows = [];
            for (const k of ["2006", "2005"]) {
              const f = o + "/" + k + ".json"; if (!fs.existsSync(f)) { rows.push("| " + k + " | no result file | | | | |"); continue; }
              const r = JSON.parse(fs.readFileSync(f, "utf8")); const s = r.stages || {}; const j = (r.findings || {}).jest_report;
              const st = (x) => x ? (x.state || x.status) + (x.exit_code != null ? " (exit " + x.exit_code + ")" : "") : "not run";
              rows.push(["", k, r.findings && r.findings.result, s.deps ? s.deps.status : "not run", st(s.build), s.jest_list ? st(s.jest_list) + ", " + s.jest_list.test_files + " files" : "not run",
                s.jest ? st(s.jest) + (j ? ", suites " + j.numTotalTestSuites + ", tests " + j.numTotalTests + ": " + j.numPassedTests + " pass / " + j.numFailedTests + " fail / " + j.numPendingTests + " skip / " + j.numTodoTests + " todo" : "") : "not run", ""].join(" | "));
            }
            const md = "| Task | Result | Install | Build | Jest list | Jest run |\n|---|---|---|---|---|---|\n" + rows.join("\n") + "\n";
            fs.writeFileSync(process.env.GITHUB_STEP_SUMMARY, md, { flag: "a" }); console.log(md);'

      - name: Check artifacts are small and secret-free
        if: always()
        run: |
          du -sh "$OUT"; ls -la "$OUT"
          if grep -rIEl '(ghp_|gho_|ghs_|github_pat_|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY|sk-ant-)' "$OUT"; then echo "::error::secret-like string in artifacts; not uploading"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kan110-feasibility-linux-x64-run2
          path: ${{ env.OUT }}
          retention-days: 5
          if-no-files-found: warn
