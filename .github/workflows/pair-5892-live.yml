# KAN-112 (senior 10662): the PROTECTED paired axios-5892 workflow. Request: bench/opus-pilot/mocha/pair-live-request.txt,
# first line "mode=smoke" | "mode=pair" | "mode=dry-run" | "mode=smoke-dry". Pushing a request does not by itself run
# anything live: every live job uses the protected environment opus-pilot-live (required reviewer: the owner), and
# pair.mjs refuses the paired route unless the owner's SEPARATE paired_route confirmation is recorded.
#   smoke      LIVE: one harmless turn on a throwaway repository; acceptable only with complete served-model and
#              subscription/billing evidence and no overage (else exit 7; the pair does not start)
#   pair       LIVE: trial-a (Claude only) FIRST, then trial-b (QB) on a fresh runner; B never downloads A's output; one
#              trial per arm; no automatic replacement. grade-a / grade-b run only after BOTH trial jobs finished, with no
#              environment and no token (independent grader, A0).
#   dry-run    NO model / token: the same jobs and order without the environment (scripted probing stage), then grading
#   smoke-dry  NO model / token: the smoke path with a scripted stage; it MUST be rejected (exit 7 = job success)
# The token secret exists only in the live trial steps; pair.mjs scans every output there and keeps nothing on a hit.
name: pair-5892-live

on:
  push:
    branches: [kan117-axios-mocha]
    paths: [bench/opus-pilot/mocha/pair-live-request.txt]

permissions:
  contents: read
  actions: read

concurrency:
  group: pair-5892-live
  cancel-in-progress: false

env:
  SWEBENCH_REF: 02e7a74ffd0b707aab73d203fe87bdc7c76afc8e
  ARCHIVE_SHA256: d06181d5365b51fc7ff490171581b9ee87d77e19b3a739a8d574bf25d9ef9479
  LOCK_SHA256: 3ff9e5ec290027e4925964a8eb537af39f676a588aa81d9da2f429619e7de1ba
  GRADER: bench/public/grader/immutable-offline-v1
  EV: bench/public/grader/immutable-offline-v1/lock-evidence/run-42906422892
  WORK: ${{ github.workspace }}/kan117-work
  PUB: ${{ github.workspace }}/kan117-publish
  INST: ${{ github.workspace }}/kan117-install-record
  IMG: ${{ github.workspace }}/kan117-images
  KAN117_IMAGES_RUN: '43610841280'
  RESTRICTED: ${{ github.workspace }}/pair-restricted
  QB_INTEGRATION: '0'

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.p.outputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262          # v4
        with: { persist-credentials: false }
      - id: p
        run: |
          set -euo pipefail
          mode=$(sed -n 's/^mode=\([a-z-]*\).*$/\1/p' <<<"$(head -n 1 bench/opus-pilot/mocha/pair-live-request.txt)")
          case "$mode" in smoke|smoke-dry|pair|dry-run) ;; *) echo "::error::bad mode"; exit 1;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  smoke:
    needs: plan
    if: ${{ needs.plan.outputs.mode == 'smoke' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: opus-pilot-live
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262          # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install QB
        run: |
          set -euo pipefail
          npm ci
          for d in intent agent context verify memory bench; do (cd "$d" && npm ci); done
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: kan117-images
          path: ${{ env.IMG }}
          run-id: ${{ env.KAN117_IMAGES_RUN }}
          github-token: ${{ github.token }}
      - name: Load the frozen image set (no build)
        env: { KAN117_CI_RUN: '1' }
        run: node bench/public/kan117/image-bundle.mjs load --in="$IMG"
      - name: Rebuild the task stores from the hash-verified dataset (network used here only)
        run: cd bench && node public/import.mjs --download
      - name: Paired smoke, arm A (LIVE, protected environment, token in this step only)
        env: { PAIR_CI_RUN: '1', PAIR_LIVE: '1', CLAUDE_CODE_OAUTH_TOKEN: '${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}' }
        run: node bench/opus-pilot/pair.mjs --arm=A --mode=smoke --repo="$WORK/repo" --store=bench/public/out --images="$IMG" --restricted="$RESTRICTED" --public="$PUB"
      - name: Cleanup check
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$PUB"
          { echo "qb_containers=$(docker ps -aq --filter label=qb.run | wc -l)"; echo "qb_volumes=$(docker volume ls -q --filter label=qb.run | wc -l)";
            echo "qb_networks=$(docker network ls -q --filter label=qb.run | wc -l)"; echo "qb_claude_auth_volume=$(docker volume ls -q --filter name=^qb-claude-auth$ | wc -l)"; } | tee "$PUB/cleanup-trial.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02    # v4
        if: ${{ !cancelled() && hashFiles('pair-restricted/trial.json') != '' }}
        with:
          name: pair-grading-input-A
          path: ${{ env.RESTRICTED }}
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02    # v4
        if: ${{ !cancelled() && true }}
        with:
          name: pair-trial-public-A
          path: ${{ env.PUB }}
          if-no-files-found: ignore
          retention-days: 30
      - name: Public notice (statuses and hashes only)
        if: ${{ !cancelled() }}
        run: |
          [ -f "$PUB/pair-A.json" ] && node -e '
            const j = require(process.argv[1]);
            console.log(`::notice title=pair-${j.arm}::arm=${j.arm} mode=${j.mode} primary=${j.primary} flags=${(j.flags||[]).join(",")} attempts=${j.attempts} verdicts=${JSON.stringify(j.attempt_verdicts)} internal=${j.internal_verdict} coding_ms=${j.coding_ms}/${j.coding_allowance_ms} timing=${JSON.stringify(j.timing)} cand=${j.candidate.bytes}B gradable=${j.candidate.gradable} sha=${String(j.candidate.sha256).slice(0,12)} probe=${JSON.stringify(j.coding_isolation_probe)} profile=${j.profile.model}/${j.profile.claude_code_version}/${j.profile.permission_mode} images=${j.distinct_launch_images.length} launches=${j.launches} grade_now=${j.grade_now} (${j.grade_basis}; pilot=${j.pilot_grade_now})`);
            console.log(`::notice title=pair-${j.arm}-why::reasons=${JSON.stringify(j.reasons)} diag=${JSON.stringify(j.diagnostics).replace(/%/g, "%25").slice(0, 3000)}`);
          ' "$PUB/pair-A.json" || true

