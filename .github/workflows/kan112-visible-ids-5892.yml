# KAN-112 (senior 10662): the pinned visible suite's identity hashes on the unchanged base (no model, no titles).
name: kan112-visible-ids-5892

on:
  push:
    branches: [kan117-axios-mocha]
    paths: [bench/opus-pilot/mocha/visible-ids-request.txt]

permissions:
  contents: read
  actions: read

concurrency:
  group: kan112-visible-ids-5892
  cancel-in-progress: false

env:
  WORK: ${{ github.workspace }}/mocha-work
  OUT: ${{ github.workspace }}/mocha-out
  IMG: ${{ github.workspace }}/kan117-images
  KAN117_IMAGES_RUN: '43610841280'
  QB_INTEGRATION: '0'

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262          # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install QB
        run: |
          set -euo pipefail
          npm ci
          for d in intent agent context verify memory bench; do (cd "$d" && npm ci); done
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: kan117-images
          path: ${{ env.IMG }}
          run-id: ${{ env.KAN117_IMAGES_RUN }}
          github-token: ${{ github.token }}
      - name: Load the saved image set; require the recorded ids (no build)
        env: { KAN117_CI_RUN: '1' }
        run: node bench/public/kan117/image-bundle.mjs load --in="$IMG"
      - name: Rebuild the task stores from the hash-verified dataset (network used here only)
        run: cd bench && node public/import.mjs --download
      - name: Starting code at the pinned base only (shallow; one commit)
        run: |
          set -euo pipefail
          mkdir -p "$WORK/repo" && cd "$WORK/repo"
          git init -q && git fetch -q --depth 1 https://github.com/axios/axios ae003913a39f3bdf9bbbd8f71a1ed681fd044d8b
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = ae003913a39f3bdf9bbbd8f71a1ed681fd044d8b; test "$(git rev-list --all --count)" = 1
      - name: Visible-suite identities (no model)
        env: { KAN117_CI_RUN: '1' }
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          node bench/opus-pilot/visible-ids-5892.mjs --repo="$WORK/repo" --store=bench/public/out --images="$IMG" --out="$OUT" | tee "$OUT/summary.txt"
      - name: Public notice (hashes and counts only)
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const j = require(process.argv[1]);
            console.log(`::notice title=visible-ids::verdict=${j.verdict} counts=${JSON.stringify(j.counts)} n=${j.identities.length} set=${j.identity_set_sha256}`);
            for (let i = 0; i < j.identities.length; i += 40) console.log(`::notice title=visible-ids-${i}::${j.identities.slice(i, i + 40).map((x) => x.id).join(",")}`);
          ' "$OUT/visible-identities-5892.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: ${{ !cancelled() }}
        with:
          name: kan112-visible-ids-5892
          path: ${{ env.OUT }}/visible-identities-5892.json
          retention-days: 90
