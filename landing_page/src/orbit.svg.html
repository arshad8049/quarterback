<!-- Decorative radar orbit (restored from 2e0e374). aria-hidden; paused when motion is off. -->
<svg class="qb-orbit" aria-hidden="true" focusable="false" viewBox="0 0 200 200" fill="none">
    <defs>
      <filter id="glow-a" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="1.8" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="glow-b" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="1.8" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="glow-core" x="-200%" y="-200%" width="500%" height="500%">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <linearGradient id="scan-grad" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#E08A4C" stop-opacity="0"/>
        <stop offset="85%" stop-color="#E08A4C" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#E08A4C" stop-opacity="0.9"/>
      </linearGradient>
      <radialGradient id="sweep-fade" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#E08A4C" stop-opacity="0.06"/>
        <stop offset="100%" stop-color="#E08A4C" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- Outermost range rings -->
    <circle cx="100" cy="100" r="97" stroke="#161C19" stroke-width="0.5"/>
    <circle cx="100" cy="100" r="90" stroke="#1A2118" stroke-width="0.3" stroke-dasharray="0.8 5"/>

    <!-- Amber rotating orbit -->
    <circle class="qb-ring-a" cx="100" cy="100" r="78" stroke="#E08A4C" stroke-width="0.75" stroke-dasharray="3 8" filter="url(#glow-a)"/>

    <!-- Intermediate reference -->
    <circle cx="100" cy="100" r="66" stroke="#182019" stroke-width="0.4"/>

    <!-- Green counter-rotating orbit -->
    <circle class="qb-ring-b" cx="100" cy="100" r="56" stroke="#6FBF9F" stroke-width="0.75" stroke-dasharray="2 7" filter="url(#glow-b)"/>

    <!-- Inner rings -->
    <circle cx="100" cy="100" r="44" stroke="#161C19" stroke-width="0.35" stroke-dasharray="0.6 4"/>
    <circle cx="100" cy="100" r="34" stroke="#1A2118" stroke-width="0.5"/>
    <circle cx="100" cy="100" r="22" stroke="#141A17" stroke-width="0.3"/>
    <circle cx="100" cy="100" r="12" stroke="#1A2118" stroke-width="0.3" stroke-dasharray="1 3"/>

    <!-- Quadrant crosshairs -->
    <line x1="100" y1="2"   x2="100" y2="24"  stroke="#223028" stroke-width="0.4"/>
    <line x1="100" y1="176" x2="100" y2="198" stroke="#223028" stroke-width="0.4"/>
    <line x1="2"   y1="100" x2="24"  y2="100" stroke="#223028" stroke-width="0.4"/>
    <line x1="176" y1="100" x2="198" y2="100" stroke="#223028" stroke-width="0.4"/>

    <!-- 45° diagonal ticks -->
    <line x1="169" y1="31"  x2="174" y2="36"  stroke="#1B2621" stroke-width="0.4"/>
    <line x1="26"  y1="31"  x2="31"  y2="36"  stroke="#1B2621" stroke-width="0.4"/>
    <line x1="169" y1="169" x2="174" y2="164" stroke="#1B2621" stroke-width="0.4"/>
    <line x1="26"  y1="169" x2="31"  y2="164" stroke="#1B2621" stroke-width="0.4"/>

    <!-- Degree tick marks on outer ring -->
    <g stroke="#1E2B23" stroke-width="0.4">
      <line x1="100" y1="3"   x2="100" y2="8"/>
      <line x1="127" y1="5.5" x2="126" y2="10.5"/>
      <line x1="150" y1="14"  x2="148" y2="18.5"/>
      <line x1="168" y1="28"  x2="165" y2="32"/>
      <line x1="180" y1="47"  x2="176" y2="49.5"/>
      <line x1="186" y1="70"  x2="182" y2="71"/>
      <line x1="186" y1="100" x2="182" y2="100"/>
      <line x1="100" y1="197" x2="100" y2="192"/>
      <line x1="14"  y1="70"  x2="18"  y2="71"/>
      <line x1="50"  y1="5.5" x2="51"  y2="10.5"/>
    </g>

    <!-- Cardinal labels -->
    <text x="103" y="8.5" font-family="monospace" font-size="4.5" fill="#2C3E36" opacity="0.9">N</text>
    <text x="103" y="196" font-family="monospace" font-size="4.5" fill="#2C3E36" opacity="0.7">S</text>
    <text x="190" y="102" font-family="monospace" font-size="4.5" fill="#2C3E36" opacity="0.7">E</text>
    <text x="5"   y="102" font-family="monospace" font-size="4.5" fill="#2C3E36" opacity="0.7">W</text>

    <!-- Scanning sweep (wedge fill) -->
    <path d="M100 100 L100 4 A96 96 0 0 1 120 5.8 Z" fill="url(#sweep-fade)" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate"
        from="0 100 100" to="360 100 100" dur="10s" repeatCount="indefinite"/>
    </path>

    <!-- Scanning beam line -->
    <g>
      <line x1="100" y1="100" x2="100" y2="4" stroke="url(#scan-grad)" stroke-width="0.7"/>
      <animateTransform attributeName="transform" type="rotate"
        from="0 100 100" to="360 100 100" dur="10s" repeatCount="indefinite"/>
    </g>

    <!-- Satellite on amber orbit -->
    <g>
      <circle cx="100" cy="22" r="3.2" fill="#E08A4C" filter="url(#glow-a)"/>
      <rect x="95.5" y="20" width="9" height="0.9" fill="#E08A4C" opacity="0.45"/>
      <animateTransform attributeName="transform" type="rotate"
        from="0 100 100" to="360 100 100" dur="46s" repeatCount="indefinite"/>
    </g>

    <!-- Two satellites on green orbit (opposite sides) -->
    <g>
      <circle cx="156" cy="100" r="2.4" fill="#6FBF9F" filter="url(#glow-b)"/>
      <animateTransform attributeName="transform" type="rotate"
        from="360 100 100" to="0 100 100" dur="30s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="44" cy="100" r="2.0" fill="#6FBF9F" filter="url(#glow-b)"/>
      <animateTransform attributeName="transform" type="rotate"
        from="180 100 100" to="-180 100 100" dur="30s" repeatCount="indefinite"/>
    </g>

    <!-- Static pulsing data points at fixed coordinates -->
    <circle class="qb-pulse" cx="100"  cy="178" r="2.3" fill="#E08A4C" style="animation-delay:0.8s"  filter="url(#glow-a)"/>
    <circle class="qb-pulse" cx="168"  cy="143" r="1.9" fill="#6FBF9F" style="animation-delay:1.7s"  filter="url(#glow-b)"/>
    <circle class="qb-pulse" cx="32"   cy="57"  r="1.9" fill="#6FBF9F" style="animation-delay:2.6s"  filter="url(#glow-b)"/>
    <circle class="qb-pulse" cx="178"  cy="72"  r="1.6" fill="#E08A4C" style="animation-delay:3.1s"  filter="url(#glow-a)"/>

    <!-- Core -->
    <circle cx="100" cy="100" r="6"   fill="#0D100F" stroke="#2A3D37" stroke-width="0.6"/>
    <circle cx="100" cy="100" r="2.4" fill="#E08A4C" filter="url(#glow-core)"/>
    <circle cx="100" cy="100" r="0.9" fill="#F4F1EA"/>
  </svg>
