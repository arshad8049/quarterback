<!doctype html><!-- Review harness for KAN-67 10824 pass A. Served from landing_page's parent; ?p=0..1 paints one state. Not part of the site. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Blueprint composition</title>
<link rel="stylesheet" href="/landing_page/src/styles/fonts.css"><link rel="stylesheet" href="/landing_page/src/styles/main.css"><link rel="stylesheet" href="/landing_page/src/styles/home.css"><link rel="stylesheet" href="/landing_page/src/styles/blueprint.css"></head>
<body><div class="qbh" id="root"></div>
<script type="module">
const get = async (f) => (await (await fetch('/landing_page/src/' + f)).text()).replaceAll('./logo-mark.svg', '/landing_page/logo-mark.svg');
document.getElementById('root').innerHTML = (await get('home-nav.html')) + (await get('home-blueprint.html'));
await document.fonts.ready; await document.fonts.load('16px Inter'); await document.fonts.load('15px "IBM Plex Mono"');
const s = document.createElement('script'); s.src = '/landing_page/src/scripts/blueprint.js';
s.onload = () => { const q = new URLSearchParams(location.search); if (!q.has('static')) { qbBlueprint.layout(); qbBlueprint.paint(Number(q.get('p') ?? 1)); } document.body.dataset.ready = '1'; };
document.body.append(s);
</script></body></html>
